version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-app-backend
    environment:
      - SEPOLIA_RPC_URL= https://eth-sepolia.g.alchemy.com/v2/eRgV0M6z4uBDs20u3ut3wXdnbrAHlfQi
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=edd6de4c03f672db2b2f54f1367c562f
      - PORT=5513
      - MONGO_URI=mongodb+srv://ahmad1:9859882669@cluster0.d7rjsu0.mongodb.net/supplyChain
      - NODE_ENV=development
      - JWT_SECRET=A1S2D3F@z
      - NEXT_PUBLIC_PINATA_API_KEY=9dabd29224fd341f9e3c
      - NEXT_PUBLIC_PINATA_SECRET_KEY=2d0bf04f3f762ec42fbeaee49290ddad47c636506494ee6a9073accb452b3ef3
      - NEXT_PUBLIC_CONTRACT_ADDRESS=0x74c2791D75D550f113b8Cf4A41425dDF837F3c54
    volumes:                         
      - ./src/api:/app/src/api
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:                                            
        NEXT_PUBLIC_PINATA_API_KEY: 9dabd29224fd341f9e3c
        NEXT_PUBLIC_PINATA_SECRET_KEY: 2d0bf04f3f762ec42fbeaee49290ddad47c636506494ee6a9073accb452b3ef3
        NEXT_PUBLIC_CONTRACT_ADDRESS: 0x74c2791D75D550f113b8Cf4A41425dDF837F3c54
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: edd6de4c03f672db2b2f54f1367c562f
        NEXT_PUBLIC_URL: http://localhost
    container_name: my-app-frontend
    environment:                                        
      - NEXT_PUBLIC_URL=http://localhost
      - NEXT_PUBLIC_PINATA_API_KEY=9dabd29224fd341f9e3c
      - NEXT_PUBLIC_PINATA_SECRET_KEY=2d0bf04f3f762ec42fbeaee49290ddad47c636506494ee6a9073accb452b3ef3
      - NEXT_PUBLIC_CONTRACT_ADDRESS=0x74c2791D75D550f113b8Cf4A41425dDF837F3c54
    volumes:
      - ./src/app:/app/src/app
      - ./src/components:/app/src/components
      - ./src/context:/app/src/context
      - ./src/lib:/app/src/lib
      - ./src/hooks:/app/src/hooks
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: my-app-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge